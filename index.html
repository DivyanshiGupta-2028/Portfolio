
<!DOCTYPE html>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,5 95,25 95,75 50,95 5,75 5,25' fill='%23070A12' stroke='%23ff4e00' stroke-width='4'/%3E%3Ctext x='50' y='60' font-family='sans-serif' font-size='32' font-weight='900' fill='%23ff4e00' text-anchor='middle'%3EDG%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Sora:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      #cyber-loader {
        position: fixed;
        inset: 0;
        background: #070A12;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        transition: opacity 0.5s ease, visibility 0.5s ease;
        font-family: 'Sora', 'Inter', sans-serif;
      }
      #cyber-loader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .loader-logo {
        width: 76px;
        height: 76px;
        border-radius: 18px;
        background: linear-gradient(135deg, rgba(255,78,0,0.18), rgba(255,59,48,0.12));
        border: 1.5px solid rgba(255,78,0,0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Sora', sans-serif;
        font-weight: 800;
        font-size: 1.7rem;
        color: #ffffff;
        box-shadow: 0 0 35px rgba(255,78,0,0.35);
        margin-bottom: 1.5rem;
        animation: logoPulse 1.8s ease-in-out infinite;
      }
      @keyframes logoPulse {
        0%, 100% { box-shadow: 0 0 20px rgba(255,78,0,0.3); transform: scale(1); }
        50% { box-shadow: 0 0 45px rgba(255,78,0,0.65), 0 0 90px rgba(239,68,68,0.25); transform: scale(1.03); }
      }
      .loader-text {
        font-size: 0.76rem;
        color: rgba(255, 255, 255, 0.7);
        letter-spacing: 0.22em;
        margin-bottom: 1.5rem;
        text-transform: uppercase;
        font-weight: 600;
      }
      .loader-bar-track {
        width: 220px;
        height: 3px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
      }
      .loader-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, #ff4e00, #ff3b30, #f97316);
        border-radius: 999px;
        animation: barLoad 1.2s ease-in-out forwards;
        box-shadow: 0 0 12px rgba(255, 78, 0, 0.6);
      }
      @keyframes barLoad {
        0% { width: 0%; }
        100% { width: 100%; }
      }
    </style>
  </head>
  <body>
    <!-- Cinematic boot loader -->
    <div id="cyber-loader">
      <div class="loader-logo">DG</div>
      <div class="loader-text">INITIALIZING DIGITAL REALM</div>
      <div class="loader-bar-track">
        <div class="loader-bar-fill"></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Remove loader once React mounts
      window.addEventListener('load', function() {
        setTimeout(function() {
          var loader = document.getElementById('cyber-loader');
          if (loader) loader.classList.add('hidden');
          setTimeout(function() {
            if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
          }, 600);
        }, 800);
      });
    </script>
  </body>
</html>
